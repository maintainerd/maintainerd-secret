name: Docker Hub Description

# Keeps the Docker Hub repository's README + short description in sync with
# DOCKERHUB.md in this repo, so the image page is version-controlled and always
# current. Runs when DOCKERHUB.md changes (or on demand). Uses the same
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets as the release push.
on:
  push:
    branches: [main]
    paths:
      - DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dockerhub-description:
    runs-on: ubuntu-latest
    # Skip cleanly until the Docker Hub credentials exist. Publishing the image
    # page is optional plumbing, so a repo not yet wired to Docker Hub should
    # report a skipped step, not a red X — a workflow that always fails for a
    # known, benign reason is a workflow nobody reads.
    #
    # The check is hoisted into `env` deliberately: the `secrets` context is NOT
    # available in a job-level `if`, but job-level `env` may read secrets and
    # `env` IS available to a step-level `if`.
    env:
      HAS_DOCKERHUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync README + short description to Docker Hub
        if: env.HAS_DOCKERHUB_CREDS == 'true'
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_ORG || secrets.DOCKERHUB_USERNAME }}/secret
          short-description: "Self-hostable secret manager: envelope-encrypted, versioned, append-only, with its own console in one container."
          readme-filepath: ./DOCKERHUB.md
