name: Licenses

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-licenses:
    name: Go dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go.mod replaces the sibling modules with workspace-local paths, which do
      # not exist on a runner; without these checkouts the Go package graph
      # cannot load at all and the job fails before doing any real work.
      - name: Check out sibling deps (kit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maintainerd/maintainerd-kit
          path: .deps/kit
      - name: Check out sibling deps (sdk)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maintainerd/maintainerd-sdk
          path: .deps/sdk
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - name: Repoint replaces at checked-out siblings
        run: |
          go mod edit -replace github.com/maintainerd/kit=./.deps/kit
          go mod edit -replace github.com/maintainerd/sdk=./.deps/sdk
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@5348b744d0983d85713295ea08a20cca1654a45e # v1.6.0
      - name: Check for forbidden/restricted licenses
        # Apache-2.0 project: fail on strong copyleft — forbidden (AGPL/GPL) and
        # restricted (LGPL). Reciprocal (MPL-2.0) is allowed: it is weak,
        # file-level copyleft that imposes no obligations on this project as a
        # consumer.
        run: go-licenses check ./... --disallowed_types=forbidden,restricted
      - name: Generate third-party notices
        run: |
          printf '# Third-Party Notices\n\nGenerated by go-licenses. See NOTICE for project copyright.\n\n' > THIRD_PARTY_NOTICES.md
          go-licenses report ./... 2>/dev/null | sort >> THIRD_PARTY_NOTICES.md || true
      - name: Upload third-party notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
