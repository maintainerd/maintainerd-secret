<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A revealed value must never end up in a third-party referer header.
         The console never puts a secret address in a URL either, but the header
         is suppressed as well so the belt does not depend on the braces. -->
    <meta name="referrer" content="same-origin" />
    <title>Maintainerd Secret</title>
    <!-- Runtime config (window.__ENV__). Loaded before the app bundle so
         config.ts can read deploy-time API / identity origins without a
         rebuild. A placeholder ships for local dev. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
