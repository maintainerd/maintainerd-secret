syntax = "proto3";

// SecretService is a standalone, encrypted secret store — its own product. It
// runs alone, or Core attaches to it via Setup (registering as controller); once
// set up, the Setup endpoint locks (the one-time setup pattern).
package maintainerd.secret.v1;

option go_package = "github.com/maintainerd/secret/gen/maintainerd/secret/v1;secretv1";

service SecretService {
  rpc Ping(PingRequest) returns (PingResponse);
  // Setup registers a controller (Core) one time; it locks afterward.
  rpc Setup(SetupRequest) returns (SetupResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message PingRequest {}
message PingResponse {
  bool ok = 1;
  bool setup_complete = 2;
}

message SetupRequest {
  string bootstrap_token = 1;
  string controller = 2;
}
message SetupResponse {
  bool ok = 1;
  string controller = 2;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}
message PutResponse {}

message GetRequest {
  string key = 1;
}
message GetResponse {
  bytes value = 1;
}

message ListRequest {
  string prefix = 1;
}
message ListResponse {
  repeated string keys = 1;
}

message DeleteRequest {
  string key = 1;
}
message DeleteResponse {}
