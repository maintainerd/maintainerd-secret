syntax = "proto3";

// SecretService is a standalone, encrypted secret store — its own product. It
// runs alone, or Core attaches to it via SetupService (registering as
// controller); once set up, the setup surface locks (the one-time setup pattern).
//
// AUTHENTICATION AND SCOPE ARE CARRIED IN METADATA, not in the messages:
//
//   authorization: Bearer <token>      an Auth-minted token; required on every
//                                      RPC except grpc.health.v1.Health
//   x-maintainerd-tenant: <slug>       selects the tenant the request addresses.
//                                      Optional; defaults to the token's tenant
//                                      claim and then to the configured default.
//                                      It is a SELECTOR, never an authorization —
//                                      naming a tenant gets you an MRN in it, and
//                                      the grant check then decides.
//   x-setup-token: <token>             the bootstrap token, on SetupService only.
//
// EVERY RPC IS AUTHORIZED AGAINST THE TARGET'S MRN and every one writes an audit
// row, including the reads. Metadata browsing (secret:ReadMetadata) and value
// reveal (secret:GetSecret) are DIFFERENT grants.
package maintainerd.secret.v1;

option go_package = "github.com/maintainerd/secret/gen/maintainerd/secret/v1;secretv1";

// SecretService is the full hierarchy + secrets surface.
service SecretService {
  rpc Ping(PingRequest) returns (PingResponse);

  // ---- Legacy flat-key surface ------------------------------------------
  // These five are the kit secret-provider client's contract (see
  // maintainerd-kit secret/ and maintainerd-sdk secret/). They are KEPT, and
  // they are now thin wrappers over the hierarchical operations below: a flat
  // key maps onto the default scope's hierarchy (store.FlatRef), so a secret
  // written through Put is an ordinary secret — versioned, audited, and
  // addressable by the hierarchical RPCs. Do not remove them; consumers depend
  // on them.
  rpc Setup(SetupRequest) returns (SetupResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // ---- Projects ----------------------------------------------------------
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // ---- Environments ------------------------------------------------------
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);
  rpc UpdateEnvironment(UpdateEnvironmentRequest) returns (UpdateEnvironmentResponse);
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse);

  // ---- Folders -----------------------------------------------------------
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
  rpc ListFolders(ListFoldersRequest) returns (ListFoldersResponse);
  // MoveFolder recomputes the materialized paths of the whole subtree AND the
  // MRNs derived from them, in one transaction.
  rpc MoveFolder(MoveFolderRequest) returns (MoveFolderResponse);
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse);

  // ---- Scope imports -----------------------------------------------------
  rpc CreateImport(CreateImportRequest) returns (CreateImportResponse);
  rpc ListImports(ListImportsRequest) returns (ListImportsResponse);
  rpc UpdateImport(UpdateImportRequest) returns (UpdateImportResponse);
  rpc DeleteImport(DeleteImportRequest) returns (DeleteImportResponse);

  // ---- Secrets -----------------------------------------------------------
  // GetSecret is the REVEAL: it returns a decrypted value and requires
  // secret:GetSecret, a distinct grant from secret:ReadMetadata.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  // DescribeSecret returns metadata only and never a value.
  rpc DescribeSecret(DescribeSecretRequest) returns (DescribeSecretResponse);
  // ListSecrets returns metadata only, scoped to a path prefix.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc UpdateSecretMetadata(UpdateSecretMetadataRequest) returns (UpdateSecretMetadataResponse);
  rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse);
  // RollbackSecret writes a NEW version carrying an older version's value.
  // History is never mutated.
  rpc RollbackSecret(RollbackSecretRequest) returns (RollbackSecretResponse);
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse);
  rpc SetRotationPolicy(SetRotationPolicyRequest) returns (SetRotationPolicyResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc ListDeletedSecrets(ListDeletedSecretsRequest) returns (ListDeletedSecretsResponse);
  rpc RestoreSecret(RestoreSecretRequest) returns (RestoreSecretResponse);
  rpc DestroySecret(DestroySecretRequest) returns (DestroySecretResponse);

  // ---- Bulk --------------------------------------------------------------
  // Both are per-item authorized and per-item audited: a batch is a transport
  // optimisation, never a permission one.
  rpc BatchGetSecrets(BatchGetSecretsRequest) returns (BatchGetSecretsResponse);
  rpc BatchPutSecrets(BatchPutSecretsRequest) returns (BatchPutSecretsResponse);

  // ---- Webhooks + audit --------------------------------------------------
  rpc CreateWebhookEndpoint(CreateWebhookEndpointRequest) returns (CreateWebhookEndpointResponse);
  rpc ListWebhookEndpoints(ListWebhookEndpointsRequest) returns (ListWebhookEndpointsResponse);
  rpc UpdateWebhookEndpoint(UpdateWebhookEndpointRequest) returns (UpdateWebhookEndpointResponse);
  rpc DeleteWebhookEndpoint(DeleteWebhookEndpointRequest) returns (DeleteWebhookEndpointResponse);
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

// SetupService is the CONTROLLED setup path: a controller (Core) drives it with
// the bootstrap token in the x-setup-token metadata header. Once it has completed
// setup, the REST wizard refuses — an instance has exactly one setup path.
service SetupService {
  rpc GetSetupStatus(GetSetupStatusRequest) returns (GetSetupStatusResponse);
  // Setup creates the tenant mirror plus the default project and environment. It
  // is idempotent: a retry after a lost response converges instead of reporting a
  // conflict that reads as "somebody else claimed this instance".
  rpc Setup(SetupServiceSetupRequest) returns (SetupServiceSetupResponse);
  // CompleteSetup closes the one-time window permanently.
  rpc CompleteSetup(CompleteSetupRequest) returns (CompleteSetupResponse);
}

// ---------------------------------------------------------------------------
// Shared messages
// ---------------------------------------------------------------------------

// SecretAddress names a secret. folder_path is optional and defaults to the
// environment root.
message SecretAddress {
  string project = 1;
  string environment = 2;
  string folder_path = 3;
  string key = 4;
}

// Page is the pagination request block.
message Page {
  int32 page = 1;
  int32 limit = 2;
}

// PageInfo is the pagination response block.
message PageInfo {
  int32 page = 1;
  int32 limit = 2;
  int64 total = 3;
}

// Project is a project as returned.
message Project {
  string project_uuid = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string status = 5;
}

// Environment is an environment as returned.
message Environment {
  string environment_uuid = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  int32 position = 5;
  string status = 6;
}

// Folder is a folder as returned.
message Folder {
  string folder_uuid = 1;
  string name = 2;
  string path = 3;
}

// ScopeImport is one import edge.
message ScopeImport {
  string import_uuid = 1;
  string folder_path = 2;
  string source_project = 3;
  string source_environment = 4;
  string source_folder_path = 5;
  int32 position = 6;
  bool enabled = 7;
}

// SecretMetadata is everything about a secret EXCEPT its value. There is no value
// field on this message, which is what makes "listing cannot leak a value" a
// property of the wire format rather than of the handler.
message SecretMetadata {
  string secret_uuid = 1;
  string folder_path = 2;
  string key = 3;
  string description = 4;
  repeated string tags = 5;
  int32 current_version = 6;
  int32 keep_versions = 7;
  string mrn = 8;
  string rotated_at = 9;
  string expires_at = 10;
  string created_at = 11;
  string updated_at = 12;
  // rotation_policy_json is the policy rendered as JSON, so the wire format does
  // not have to track every future policy field.
  string rotation_policy_json = 13;
}

// VersionMetadata describes one version without its payload.
message VersionMetadata {
  int32 version = 1;
  string kek_id = 2;
  string value_type = 3;
  // checksum is SHA-256 of the plaintext, hex-encoded. It is how a consumer
  // detects change without a reveal.
  string checksum = 4;
  string created_at = 5;
}

// DeletedSecret is an entry in the recovery window.
message DeletedSecret {
  string secret_uuid = 1;
  string folder_path = 2;
  string key = 3;
  int32 current_version = 4;
  string deleted_at = 5;
  string destroy_after = 6;
}

// PutResult reports what a write did.
message PutResult {
  string secret_uuid = 1;
  int32 version = 2;
  bool created = 3;
  // unchanged is true when the submitted value matched the current version's
  // checksum, so NO new version was written.
  bool unchanged = 4;
  int32 pruned = 5;
}

// GeneratorSpec says how a rotation produces its new value.
message GeneratorSpec {
  // type is "random" or "supplied".
  string type = 1;
  int32 length = 2;
  // charset is alphanumeric | alphanumeric-symbols | hex | base64url.
  string charset = 3;
  // value is the caller-supplied plaintext for the "supplied" generator. It is
  // NEVER accepted on a stored rotation policy.
  bytes value = 4;
}

// WebhookEndpoint is an endpoint as returned. There is no signing-key field: the
// key is disclosed once, in CreateWebhookEndpointResponse, and never again.
message WebhookEndpoint {
  string endpoint_uuid = 1;
  string url = 2;
  string description = 3;
  repeated string events = 4;
  string status = 5;
  int32 timeout_seconds = 6;
  int32 max_attempts = 7;
  string last_triggered_at = 8;
}

// WebhookDelivery is one delivery record.
message WebhookDelivery {
  string delivery_uuid = 1;
  string event_type = 2;
  string resource_mrn = 3;
  int32 version = 4;
  int32 attempt_count = 5;
  string status = 6;
  int32 response_status = 7;
  string error = 8;
  string created_at = 9;
}

// AuditEvent is one row of the access trail. It carries no value and no field
// that could hold one.
message AuditEvent {
  string event_uuid = 1;
  string actor_subject = 2;
  string actor_kind = 3;
  string action = 4;
  string resource_mrn = 5;
  int32 version = 6;
  string outcome = 7;
  string reason = 8;
  string ip_address = 9;
  string user_agent = 10;
  string request_id = 11;
  string created_at = 12;
}

// ---------------------------------------------------------------------------
// Ping
// ---------------------------------------------------------------------------

message PingRequest {}
message PingResponse {
  bool ok = 1;
  bool setup_complete = 2;
}

// ---------------------------------------------------------------------------
// Legacy flat-key surface
// ---------------------------------------------------------------------------

message SetupRequest {
  string bootstrap_token = 1;
  string controller = 2;
}
message SetupResponse {
  bool ok = 1;
  string controller = 2;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}
message PutResponse {}

message GetRequest {
  string key = 1;
}
message GetResponse {
  bytes value = 1;
}

message ListRequest {
  string prefix = 1;
}
message ListResponse {
  repeated string keys = 1;
}

message DeleteRequest {
  string key = 1;
}
message DeleteResponse {}

// ---------------------------------------------------------------------------
// Projects
// ---------------------------------------------------------------------------

message CreateProjectRequest {
  string slug = 1;
  string name = 2;
  string description = 3;
}
message CreateProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {
  Page page = 1;
}
message ListProjectsResponse {
  repeated Project projects = 1;
  PageInfo page_info = 2;
}

message GetProjectRequest {
  string slug = 1;
}
message GetProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  string slug = 1;
  string name = 2;
  string description = 3;
  string status = 4;
}
message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string slug = 1;
}
message DeleteProjectResponse {
  bool deleted = 1;
}

// ---------------------------------------------------------------------------
// Environments
// ---------------------------------------------------------------------------

message CreateEnvironmentRequest {
  string project = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  int32 position = 5;
}
message CreateEnvironmentResponse {
  Environment environment = 1;
}

message ListEnvironmentsRequest {
  string project = 1;
}
message ListEnvironmentsResponse {
  repeated Environment environments = 1;
}

message GetEnvironmentRequest {
  string project = 1;
  string slug = 2;
}
message GetEnvironmentResponse {
  Environment environment = 1;
}

message UpdateEnvironmentRequest {
  string project = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  int32 position = 5;
  string status = 6;
}
message UpdateEnvironmentResponse {
  Environment environment = 1;
}

message DeleteEnvironmentRequest {
  string project = 1;
  string slug = 2;
}
message DeleteEnvironmentResponse {
  bool deleted = 1;
}

// ---------------------------------------------------------------------------
// Folders
// ---------------------------------------------------------------------------

message CreateFolderRequest {
  string project = 1;
  string environment = 2;
  string path = 3;
}
message CreateFolderResponse {
  Folder folder = 1;
}

message ListFoldersRequest {
  string project = 1;
  string environment = 2;
  string prefix = 3;
}
message ListFoldersResponse {
  repeated Folder folders = 1;
}

message MoveFolderRequest {
  string project = 1;
  string environment = 2;
  string from = 3;
  string to = 4;
}
message MoveFolderResponse {
  Folder folder = 1;
}

message DeleteFolderRequest {
  string project = 1;
  string environment = 2;
  string path = 3;
  // recovery_window is a duration string; empty uses the service default.
  string recovery_window = 4;
}
message DeleteFolderResponse {
  int64 secrets_deleted = 1;
}

// ---------------------------------------------------------------------------
// Scope imports
// ---------------------------------------------------------------------------

message CreateImportRequest {
  string project = 1;
  string environment = 2;
  string folder_path = 3;
  string source_project = 4;
  string source_environment = 5;
  string source_folder_path = 6;
  int32 position = 7;
}
message CreateImportResponse {
  ScopeImport scope_import = 1;
}

message ListImportsRequest {
  string project = 1;
  string environment = 2;
  string folder_path = 3;
}
message ListImportsResponse {
  repeated ScopeImport imports = 1;
}

message UpdateImportRequest {
  string import_uuid = 1;
  bool enabled = 2;
  int32 position = 3;
}
message UpdateImportResponse {
  ScopeImport scope_import = 1;
}

message DeleteImportRequest {
  string import_uuid = 1;
}
message DeleteImportResponse {
  bool deleted = 1;
}

// ---------------------------------------------------------------------------
// Secrets
// ---------------------------------------------------------------------------

message GetSecretRequest {
  SecretAddress address = 1;
  // version pins a specific version; 0 means the current one.
  int32 version = 2;
}
message GetSecretResponse {
  bytes value = 1;
  int32 version = 2;
  string value_type = 3;
  string mrn = 4;
  // reference_hops names the secrets a reference chain traversed to produce this
  // value, in order. Empty for an ordinary secret.
  repeated string reference_hops = 5;
}

message DescribeSecretRequest {
  SecretAddress address = 1;
}
message DescribeSecretResponse {
  SecretMetadata secret = 1;
}

message ListSecretsRequest {
  string project = 1;
  string environment = 2;
  // path_prefix limits the listing to a folder and its descendants.
  string path_prefix = 3;
  Page page = 4;
}
message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
  PageInfo page_info = 2;
}

message PutSecretRequest {
  SecretAddress address = 1;
  bytes value = 2;
  // value_type is opaque | json | reference. Defaults to opaque.
  string value_type = 3;
  string description = 4;
  repeated string tags = 5;
  int32 keep_versions = 6;
  string rotation_policy_json = 7;
  string expires_at = 8;
  bool create_folders = 9;
}
message PutSecretResponse {
  PutResult result = 1;
}

message UpdateSecretMetadataRequest {
  SecretAddress address = 1;
  string description = 2;
  repeated string tags = 3;
  int32 keep_versions = 4;
  string rotation_policy_json = 5;
  string expires_at = 6;
}
message UpdateSecretMetadataResponse {
  SecretMetadata secret = 1;
}

message ListSecretVersionsRequest {
  SecretAddress address = 1;
  Page page = 2;
}
message ListSecretVersionsResponse {
  repeated VersionMetadata versions = 1;
  PageInfo page_info = 2;
}

message RollbackSecretRequest {
  SecretAddress address = 1;
  int32 version = 2;
}
message RollbackSecretResponse {
  PutResult result = 1;
}

message RotateSecretRequest {
  SecretAddress address = 1;
  GeneratorSpec generator = 2;
}
message RotateSecretResponse {
  // The rotated value is NOT returned: reading it is a reveal, with its own
  // grant and its own audit row.
  PutResult result = 1;
}

message SetRotationPolicyRequest {
  SecretAddress address = 1;
  bool enabled = 2;
  // interval is a duration string such as "720h".
  string interval = 3;
  GeneratorSpec generator = 4;
}
message SetRotationPolicyResponse {
  SecretMetadata secret = 1;
}

message DeleteSecretRequest {
  SecretAddress address = 1;
  string recovery_window = 2;
}
message DeleteSecretResponse {
  DeletedSecret deleted = 1;
}

message ListDeletedSecretsRequest {
  string project = 1;
  string environment = 2;
  Page page = 3;
}
message ListDeletedSecretsResponse {
  repeated DeletedSecret deleted = 1;
}

message RestoreSecretRequest {
  string secret_uuid = 1;
}
message RestoreSecretResponse {
  SecretMetadata secret = 1;
}

message DestroySecretRequest {
  string secret_uuid = 1;
}
message DestroySecretResponse {
  bool destroyed = 1;
}

// ---------------------------------------------------------------------------
// Bulk
// ---------------------------------------------------------------------------

message BatchGetSecretsItem {
  SecretAddress address = 1;
  int32 version = 2;
}
message BatchGetSecretsResult {
  SecretAddress address = 1;
  bytes value = 2;
  int32 version = 3;
  string value_type = 4;
  string mrn = 5;
  repeated string reference_hops = 6;
  // error is set instead of value when this item was refused or missing. Partial
  // results are the contract: one denial must not hide the other items.
  string error = 7;
}
message BatchGetSecretsRequest {
  repeated BatchGetSecretsItem items = 1;
}
message BatchGetSecretsResponse {
  repeated BatchGetSecretsResult results = 1;
}

message BatchPutSecretsItem {
  SecretAddress address = 1;
  bytes value = 2;
  string value_type = 3;
  string description = 4;
  repeated string tags = 5;
  bool create_folders = 6;
}
message BatchPutSecretsResult {
  SecretAddress address = 1;
  PutResult result = 2;
  string error = 3;
}
message BatchPutSecretsRequest {
  repeated BatchPutSecretsItem items = 1;
}
message BatchPutSecretsResponse {
  repeated BatchPutSecretsResult results = 1;
}

// ---------------------------------------------------------------------------
// Webhooks + audit
// ---------------------------------------------------------------------------

message CreateWebhookEndpointRequest {
  string project = 1;
  string url = 2;
  string description = 3;
  repeated string events = 4;
  int32 timeout_seconds = 5;
  int32 max_attempts = 6;
}
message CreateWebhookEndpointResponse {
  WebhookEndpoint endpoint = 1;
  // signing_key is base64 and is disclosed ONCE, here. There is no read-it-back
  // RPC: an HMAC key that can be fetched is a forgery primitive.
  string signing_key = 2;
}

message ListWebhookEndpointsRequest {
  string project = 1;
  Page page = 2;
}
message ListWebhookEndpointsResponse {
  repeated WebhookEndpoint endpoints = 1;
  PageInfo page_info = 2;
}

message UpdateWebhookEndpointRequest {
  string project = 1;
  string endpoint_uuid = 2;
  string url = 3;
  string description = 4;
  repeated string events = 5;
  string status = 6;
  int32 timeout_seconds = 7;
  int32 max_attempts = 8;
}
message UpdateWebhookEndpointResponse {
  WebhookEndpoint endpoint = 1;
}

message DeleteWebhookEndpointRequest {
  string project = 1;
  string endpoint_uuid = 2;
}
message DeleteWebhookEndpointResponse {
  bool deleted = 1;
}

message ListWebhookDeliveriesRequest {
  string project = 1;
  string endpoint_uuid = 2;
  Page page = 3;
}
message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
  PageInfo page_info = 2;
}

message ListAuditEventsRequest {
  Page page = 1;
}
message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  PageInfo page_info = 2;
}

// ---------------------------------------------------------------------------
// SetupService
// ---------------------------------------------------------------------------

message GetSetupStatusRequest {}
message GetSetupStatusResponse {
  // completed is the only field an unauthenticated caller receives. Everything
  // else requires the setup token or secret:Admin.
  bool completed = 1;
  string controller = 2;
  string controller_kind = 3;
  string mode = 4;
  string completed_at = 5;
  string tenant = 6;
  string auth_tenant_uuid = 7;
  string project = 8;
  string environment = 9;
  // permissions is what this service ENFORCES, reported so a controller
  // registers exactly that and cannot drift from it.
  repeated string permissions = 10;
  bool rest_wizard_open = 11;
}

message SetupServiceSetupRequest {
  string tenant = 1;
  string tenant_display_name = 2;
  // auth_tenant_uuid links this mirror to the Auth tenant this instance serves.
  string auth_tenant_uuid = 3;
  string project = 4;
  string environment = 5;
  // controller identifies the driving service; recorded on the durable lock.
  string controller = 6;
}
message SetupServiceSetupResponse {
  string tenant_uuid = 1;
  string tenant = 2;
  string project = 3;
  string environment = 4;
  bool already_existed = 5;
  repeated string permissions = 6;
}

message CompleteSetupRequest {
  string controller = 1;
}
message CompleteSetupResponse {
  bool completed = 1;
  string controller = 2;
  string controller_kind = 3;
}
