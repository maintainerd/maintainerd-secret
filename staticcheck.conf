# staticcheck's default check set, minus the stylistic checks the maintainerd
# repos deliberately do not enforce. Kept identical to maintainerd-core and
# maintainerd-auth so a package moving between repos does not change verdict.
#
# ST1000 (package comment), ST1003 (naming conventions), ST1020/ST1021/ST1022
# (comment-on-exported-X) are documentation-style checks, not correctness ones;
# they are off across the ecosystem.
#
# ST1016 (consistent receiver names) and S1016 (use a type conversion instead of
# a struct literal) are disabled on purpose: HTTP request DTOs are kept separate
# from the domain input DTOs so the transport layer and the domain can evolve
# independently, even where their fields currently coincide. Explicit field
# mapping in handlers is intentional.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-S1016"]
